void checklease(int k) {
    if (lease.payment_acc[k] >= car.price[k])
        cout << "\n\n\n\t\t\t 차량 렌트가 성공적으로 완료되었습니다!! " << endl;
    else
        cout << "\n\n\n\t\t\t " << endl;
}

void user_input(int theChoice) {
    system("CLS");
