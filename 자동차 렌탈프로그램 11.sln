    cout << "\t\t\t반납일을 입력하시오 : ";
    cin >> lease.return_date[j];
    checklease(j);
}

int login() {
    string pass = "";
    char ch;
    cout << "\n\n\n\n\n\n\n\t\t\t\t\t   Car Rental System Login";
    cout << "\n\n\n\n\n\n\n\t\t\t\t\t 비밀번호를 입력하십시오: ";
    ch = _getch();
    while (ch != 13) { //character 13 is enter
        pass.push_back(ch);
        cout << '*';
        ch = _getch();
    }
    if (pass == "pass") {
        cout << "\n\n\n\n\t\t\t정보가 확인되었습니다.  'car retal system'에 오신 것을 환영합니다 \n\n";
        getchar(); // 대기 후 종료
        system("CLS");
    }
    else {
        cout << "\n\n\n\n\t\t\t정보가 일치하지 않습니다. 다시 시도하십시오!!\n";
        getchar(); // 대기 후 종료
        system("CLS");
        login();
    }
    return 0;
}

